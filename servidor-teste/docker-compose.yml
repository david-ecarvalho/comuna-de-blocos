# Servidor de TESTE local (fase 1): fechado, só para quem desenvolve.
# A porta local só responde nesta máquina (127.0.0.1). Quem é de fora entra pelo túnel do playit.gg (serviço playit),
# sem abrir porta no roteador. Com a vaquinha, o próximo passo é o proxy Velocity numa VPS (docs/pesquisa-fase-0.md).
#
# Uso:  docker compose up -d      (sobe)
#       docker compose logs -f    (acompanha)
#       docker compose down       (desliga)
# O mundo e os arquivos do servidor ficam em ./dados (fora do git).
services:
  comuna:
    image: itzg/minecraft-server:java25
    container_name: comuna-teste
    ports:
      - "127.0.0.1:25565:25565"
    environment:
      EULA: "${EULA:-FALSE}"          # a EULA da Mojang é aceita por quem roda o servidor, no arquivo .env
      TYPE: PAPER
      VERSION: "${VERSAO:-26.3}"
      MEMORY: 4G
      ONLINE_MODE: "FALSE"             # login próprio do plugin Comuna (/registrar e /entrar)
      ENFORCE_SECURE_PROFILE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: "${WHITELIST:-}"
      OPS: ""                         # ninguém com /op; permissões pelo LuckPerms
      # RCON só dentro da rede do Docker, para o backup pausar a gravação do mundo; a porta não sai da máquina
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_SENHA:?falta RCON_SENHA no .env}"
      ENABLE_QUERY: "FALSE"
      CREATE_CONSOLE_IN_PIPE: "TRUE"   # comandos de console só de dentro desta máquina (docker exec mc-send-to-console)
      MOTD: "Comuna de Blocos (teste)"
      DIFFICULTY: normal
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      TZ: America/Sao_Paulo
      # Plugins só do Modrinth (nunca de fórum ou arquivo enviado por alguém). O CoreProtect 24.1 ainda não lista a
      # 26.3 (só até a 26.2), e o instalador recusa: o arquivo oficial do Modrinth fica em ./plugins-extra, conferido
      # pelo SHA-512 (ver plugins-extra.txt), e o servidor copia de /plugins.
      MODRINTH_PROJECTS: |
        luckperms
        grimac
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
    volumes:
      - ./dados:/data
      - ./plugins-extra:/plugins:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    restart: "no"

  # Túnel do playit.gg (02/11/2026): os jogadores conectam no endereço do playit e o IP de casa não aparece, sem
  # abrir porta no roteador. Divide a rede com o servidor, então o túnel aponta para 127.0.0.1:25565.
  # A chave do agente fica no .env (PLAYIT_SECRET), nunca no git.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: comuna-playit
    network_mode: "service:comuna"
    environment:
      SECRET_KEY: "${PLAYIT_SECRET:?falta PLAYIT_SECRET no .env}"
    # usa a rede do servidor: quando o servidor reinicia, o túnel tem que reiniciar junto, senão fica sem internet
    depends_on:
      comuna:
        condition: service_started
        restart: true
    restart: "no"

  # Backup do mundo (02/11/2026): a cada 6 horas, pausando a gravação pelo RCON; guarda 7 dias em ./backups
  # (fora do git). Não roda backup novo enquanto ninguém joga.
  backup:
    image: itzg/mc-backup:latest
    container_name: comuna-backup
    environment:
      BACKUP_INTERVAL: "6h"
      INITIAL_DELAY: "2m"
      PRUNE_BACKUPS_DAYS: "7"
      PAUSE_IF_NO_PLAYERS: "true"
      RCON_HOST: comuna
      RCON_PASSWORD: "${RCON_SENHA:?falta RCON_SENHA no .env}"
      TZ: America/Sao_Paulo
    volumes:
      - ./dados:/data:ro
      - ./backups:/backups
    depends_on:
      - comuna
    restart: "no"
