# Comuna de Blocos
base:
  # metade do lado da base: raio 10 = 21 x 21 blocos
  raio: 10
lava:
  # defesa contra lavacast: no máximo tantos baldes de lava por minuto, por jogador
  baldes-por-minuto: 6
vale-trabalho:
  # Crítica do Programa de Gotha: uma parte do trabalho não vira vale e fica para a necessidade (fundo social)
  fundo-social-percentual: 20
  # trabalho de uma unidade, em vales (pedra = 1 pedregulho, madeira = 1 graveto, trigo = 1 trigo, ferro = 1 lingote,
  # comida = 1 ponto de fome da comida pronta: pão = 5)
  pesos:
    pedra: 1
    madeira: 1
    trigo: 1
    ferro: 4
    comida: 1
necessidade:
  # com quantos pontos de fome a Comissão manda comida (6 = 3 coxinhas, quando o jogo trava a corrida)
  fome-que-pede-comida: 6
  # quem pode trabalhar e não trabalha: nas primeiras horas de jogo a Comissão atende todo mundo; depois, só quem
  # depositou alguma coisa nas últimas horas de jogo (tempo jogado, não de relógio)
  horas-de-chegada: 2
  horas-sem-contribuir: 2
guarda:
  # golens de ferro da Guarda Popular na praça do spawn (não atacam trabalhador nem soltam ferro)
  golens: 3
guarda-de-dados:
  # prazos do parecer jurídico de 02/11/2026 (LGPD): registro de construção e logs do servidor
  coreprotect-dias: 90
  logs-dias: 30
