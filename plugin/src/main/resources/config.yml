# Comuna de Blocos
base:
  # metade do lado da base: raio 10 = 21 x 21 blocos
  raio: 10
lava:
  # defesa contra lavacast: no máximo tantos baldes de lava por minuto, por jogador
  baldes-por-minuto: 6
vale-trabalho:
  # Crítica do Programa de Gotha: uma parte do trabalho não vira vale e fica para a necessidade (fundo social)
  fundo-social-percentual: 20
  # trabalho de uma unidade, em vales (pedra = 1 pedregulho, madeira = 1 graveto, trigo = 1 trigo, ferro = 1 lingote,
  # comida = 1 ponto de fome da comida pronta: pão = 5)
  pesos:
    pedra: 1
    madeira: 1
    trigo: 1
    ferro: 4
    comida: 1
necessidade:
  # com quantos pontos de fome a Comissão manda comida (6 = 3 coxinhas, quando o jogo trava a corrida)
  fome-que-pede-comida: 6
