name: Comuna
version: ${project.version}
main: io.github.davidecarvalho.comuna.ComunaPlugin
api-version: "26.3"
description: Bases pessoais protegidas, áreas coletivas e defesa contra lavacast.
website: https://github.com/david-ecarvalho/comuna-de-blocos
commands:
  base:
    description: Registrar, ver ou remover a sua base pessoal.
    usage: /base registrar | info | remover
  coletiva:
    description: "Criar, remover ou listar áreas coletivas (coordenação)."
    usage: /coletiva criar <nome> <raio> [fundicao] | remover <nome> | lista
  estoque:
    description: "Estoque coletivo: depositar o que está na mão (ganha vales-trabalho) ou ver o estoque."
    usage: /estoque depositar [tudo] | ver
  plano:
    description: "Coordenação: colocar ou remover o NPC da Comissão do Plano."
    usage: /plano npc | remover
permissions:
  comuna.coordenacao:
    description: "Coordenação: cria áreas coletivas e coloca a Comissão do Plano."
    default: false
  comuna.admin:
    description: "Passa por cima das proteções (só para manutenção)."
    default: false
