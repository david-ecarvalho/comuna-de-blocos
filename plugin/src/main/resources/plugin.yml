name: Comuna
version: ${project.version}
main: io.github.davidecarvalho.comuna.ComunaPlugin
api-version: "26.3"
description: "Bases pessoais protegidas, áreas coletivas, defesa contra lavacast e a Comissão do Plano (necessidade e vale-trabalho)."
website: https://github.com/david-ecarvalho/comuna-de-blocos
commands:
  base:
    description: Registrar, ver ou remover a sua base pessoal.
    usage: /base registrar | info | remover
  coletiva:
    description: "Criar, remover ou listar áreas coletivas (coordenação)."
    usage: /coletiva criar <nome> <raio> [fundicao] | remover <nome> | lista
  estoque:
    description: "Estoque coletivo: depositar o que está na mão (recurso ou comida pronta, ganha vales-trabalho) ou ver o estoque."
    usage: /estoque depositar [tudo] | ver
  plano:
    description: "Coordenação: mudar de lugar (perto do spawn) ou remover o NPC da Comissão do Plano."
    usage: /plano npc | remover
  entrar:
    description: "Entrar no servidor com a sua senha."
    usage: /entrar <senha>
    aliases: [login]
  registrar:
    description: "Primeira vez: criar a sua senha."
    usage: /registrar <senha> <senha>
    aliases: [register]
  trocarsenha:
    description: "Trocar a sua senha."
    usage: /trocarsenha <senha atual> <senha nova>
  senha:
    description: "Console: apagar a senha de quem esqueceu."
    usage: /senha remover <nick>
permissions:
  comuna.coordenacao:
    description: "Coordenação: cria áreas coletivas e coloca a Comissão do Plano."
    default: false
  comuna.admin:
    description: "Passa por cima das proteções (só para manutenção)."
    default: false
