name: Comuna
version: ${project.version}
main: io.github.davidecarvalho.comuna.ComunaPlugin
api-version: "26.3"
description: Bases pessoais protegidas, áreas coletivas e defesa contra lavacast.
website: https://github.com/david-ecarvalho/comuna-de-blocos
commands:
  base:
    description: Registrar, ver ou remover a sua base pessoal.
    usage: /base registrar | info | remover
  coletiva:
    description: "Criar, remover ou listar áreas coletivas (coordenação)."
    usage: /coletiva criar <nome> <raio> [fundicao] | remover <nome> | lista
permissions:
  comuna.admin:
    description: "Coordenação: cria áreas coletivas e passa por cima das proteções."
    default: false
